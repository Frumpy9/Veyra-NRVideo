name: Linux player Vulkan checks
on:
  push:
    branches: ['linux/**']
    paths: ['linux/player/**', 'CMakeLists.txt', '.github/workflows/linux-player-checks.yml']
  pull_request:
    paths: ['linux/player/**', 'CMakeLists.txt', '.github/workflows/linux-player-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vulkan-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Install build and software Vulkan packages
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-install-recommends cmake ninja-build g++ libvulkan-dev glslang-tools mesa-vulkan-drivers vulkan-validationlayers
      - name: Configure Linux backend without OBS
        run: cmake -S . -B out/linux-player -G Ninja -DCMAKE_BUILD_TYPE=Release -DVEYRA_BUILD_OBS_FILTER=OFF -DVEYRA_BUILD_LINUX_PLAYER=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build out/linux-player --parallel 2
      - name: Verify intermediate frames with software Vulkan and validation
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          set -o pipefail
          ctest --test-dir out/linux-player -V --timeout 120 2>&1 | tee out/linux-player/validation.log
          if grep -E 'Validation Error|VUID-' out/linux-player/validation.log; then exit 1; fi
